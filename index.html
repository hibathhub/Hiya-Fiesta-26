<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIYA FIESTA '26 | BEYOND EVERY HORIZON</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  :root {
    --primary-red: #963535;
    --primary-dark: #632121;
    --primary-light: #b84a4a;
    --accent-gold: #f59e0b;
    --bg-main: #0d0a0a;
    --card-bg: #1c1414;
    --input-bg: #2b1f1f;
    --text-light: #fef2f2;
    --text-muted: #d1a5a5;
    --border-line: #422121;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-light);
    min-height: 100vh;
  }

  /* --- TOP NAVBAR & SIDE DRAWER STYLES --- */
  .top {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(99, 33, 33, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--accent-gold);
    padding: 12px 16px;
    color: #fff;
  }

  .nav {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: var(--accent-gold);
    font-size: 22px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }

  .brand { font-weight: 900; font-size: 1.1rem; color: var(--accent-gold); letter-spacing: 1.5px; }
  .user-badge { font-size: 11px; font-weight: 700; background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--accent-gold); white-space: nowrap; }

  /* Desktop Navigation Bar */
  .desktop-navlinks {
    max-width: 1000px;
    margin: auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 10px;
  }
  .desktop-navlinks button {
    background: none;
    border: none;
    font-weight: 700;
    color: var(--text-muted);
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .desktop-navlinks button.active {
    color: var(--accent-gold);
    border-bottom: 2px solid var(--accent-gold);
  }

  /* Side Drawer Overlay & Panel (Mobile) */
  .drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }
  .drawer-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .side-drawer {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100vh;
    background: var(--card-bg);
    border-right: 2px solid var(--primary-red);
    z-index: 201;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: left 0.3s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.6);
  }
  .side-drawer.open {
    left: 0;
  }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-line);
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .drawer-header h3 { margin: 0; color: var(--accent-gold); font-size: 1.1rem; }
  .close-drawer { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

  .side-drawer button {
    width: 100%;
    text-align: left;
    background: var(--input-bg);
    border: 1px solid var(--border-line);
    color: var(--text-light);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .side-drawer button.active {
    background: var(--primary-red);
    border-color: var(--accent-gold);
    color: #fff;
  }

  /* Responsive Rules */
  @media (max-width: 768px) {
    .menu-toggle { display: block; }
    .desktop-navlinks { display: none; }
  }

  main { max-width: 1000px; margin: auto; padding: 20px; }

  .hero {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-red) 60%, var(--primary-light) 100%);
    color: #fff;
    border-radius: 20px;
    padding: 32px 20px;
    margin-bottom: 20px;
    border: 2px solid var(--accent-gold);
    box-shadow: 0 10px 30px rgba(150, 53, 53, 0.4);
    text-align: center;
  }

  .hero h1 { font-size: 2rem; margin: 8px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6); letter-spacing: 1px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; font-weight: 800; color: var(--accent-gold); text-transform: uppercase; }

  .login-card, .panel {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border-line);
    margin-bottom: 16px;
  }

  .login-card { max-width: 420px; margin: 20px auto; border-top: 5px solid var(--primary-red); }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); }
  
  input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border-line);
    border-radius: 12px;
    font-size: 14px;
    background: var(--input-bg);
    color: #fff;
  }

  .btn, .primary {
    width: 100%;
    background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-light) 100%);
    color: #fff;
    border: 1px solid var(--primary-light);
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(150, 53, 53, 0.4);
    font-size: 15px;
  }

  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

  .big-number { font-size: 3rem; font-weight: 900; color: var(--accent-gold); }
  .pill { font-size: 11px; background: rgba(150, 53, 53, 0.3); color: #fff; padding: 3px 10px; border-radius: 15px; font-weight: 800; border: 1px solid var(--primary-light); }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top">
    <div class="nav">
      <div class="nav-left">
        <button class="menu-toggle" onclick="toggleDrawer(true)">☰</button>
        <div class="brand">✨ HIYA FIESTA '26</div>
      </div>
      <div id="user-status" class="user-badge">Not Logged In</div>
    </div>
    <div class="desktop-navlinks" id="desktop-navlinks"></div>
  </div>

  <!-- Mobile Side Drawer & Overlay -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
  <div class="side-drawer" id="side-drawer">
    <div class="drawer-header">
      <h3>Navigation Menu</h3>
      <button class="close-drawer" onclick="toggleDrawer(false)">✕</button>
    </div>
    <div id="side-navlinks"></div>
  </div>

  <main id="app"></main>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://rkexjkapqadlnvwxvgvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhc2VCYXNlIiwicmVmIjoicmtleGprYXBxYWRsbnZ3eHZndnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczODE2M2I2OSwiZXhwIjoyMDUzNzM5YjY5fQ.Lax0THM369QNC7LJ2NALiCFogib6ULAaMXV5A";
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let currentUser = null;
    let currentRole = null;
    let currentPage = "Login";

    const ROLE_KEYS = {
      "Fest Controller": "admin123",
      "Executive": "exec2026",
      "Group Leader": "leader2026"
    };

    function toggleDrawer(open) {
      const overlay = document.getElementById("drawer-overlay");
      const drawer = document.getElementById("side-drawer");
      if (open) {
        overlay.classList.add("open");
        drawer.classList.add("open");
      } else {
        overlay.classList.remove("open");
        drawer.classList.remove("open");
      }
    }

    function renderNav() {
      const statusDiv = document.getElementById("user-status");
      const desktopNavDiv = document.getElementById("desktop-navlinks");
      const sideNavDiv = document.getElementById("side-navlinks");

      if (!currentUser) {
        statusDiv.innerText = "Sign-In Required";
        desktopNavDiv.innerHTML = `<button class="active" onclick="navigate('Login')">Sign In</button>`;
        sideNavDiv.innerHTML = `<button class="active" onclick="navigate('Login')">Sign In</button>`;
        return;
      }

      statusDiv.innerText = `${currentUser.name} (${currentRole})`;

      let pages = ["Home", "Scoreboard", "Results", "Announcements", "My Fiesta"];
      
      if (["Fest Controller", "Executive", "Group Leader"].includes(currentRole)) {
        pages.push("Programs");
      }
      if (["Fest Controller", "Executive"].includes(currentRole)) {
        pages.push("Admin");
      }

      // Render Desktop Buttons
      desktopNavDiv.innerHTML = pages.map(p => 
        `<button class="${currentPage === p ? 'active' : ''}" onclick="navigate('${p}')">${p}</button>`
      ).join('') + `<button onclick="logout()" style="color:#f87171;">Logout</button>`;

      // Render Mobile Drawer Buttons
      sideNavDiv.innerHTML = pages.map(p => 
        `<button class="${currentPage === p ? 'active' : ''}" onclick="navigate('${p}'); toggleDrawer(false);">${p}</button>`
      ).join('') + `<button onclick="logout(); toggleDrawer(false);" style="color:#f87171; margin-top: auto;">Logout</button>`;
    }

    function navigate(page) {
      currentPage = page;
      renderNav();
      renderPage();
    }

    async function renderPage() {
      const app = document.getElementById("app");

      if (!currentUser || currentPage === "Login") {
        app.innerHTML = `
          <div class="login-card">
            <h2 style="margin-top:0; text-align:center; color:var(--accent-gold);">HIYA FIESTA '26</h2>
            <p style="text-align:center; font-size:11px; color:var(--text-muted); margin-bottom:24px; font-weight:700; text-transform:uppercase; letter-spacing:2px;">Arts Festival Portal</p>
            <div class="form-group">
              <label>Select Your Role</label>
              <select id="role-select" onchange="toggleRoleInputs(this.value)">
                <option value="Student">Student / Viewer</option>
                <option value="Group Leader">Group Leader</option>
                <option value="Executive">Executive Committee</option>
                <option value="Fest Controller">Fest Controller (Admin)</option>
              </select>
            </div>
            
            <div class="form-group">
              <label id="identifier-label">Group + Chest Number</label>
              <input id="user-identifier" placeholder="e.g. DIJLA102">
            </div>

            <div class="form-group" id="access-key-group" style="display:none;">
              <label>Portal Access PIN</label>
              <input id="access-key" type="password" placeholder="Enter Role PIN">
            </div>
            <button class="btn" onclick="handleLogin()">Sign In to Portal</button>
          </div>
        `;
        return;
      }

      if (currentPage === "Home") {
        app.innerHTML = `
          <div class="hero">
            <div class="eyebrow">ARTS FESTIVAL 2026</div>
            <h1>BEYOND EVERY HORIZON</h1>
            <p>Welcome, <strong>${currentUser.name}</strong> | Role: <strong>${currentRole}</strong></p>
          </div>
          <div class="grid3">
            <div class="panel" onclick="navigate('Scoreboard')" style="cursor:pointer; border-left: 4px solid var(--primary-red);">
              <h3 style="color:#fff; margin-top:0;">🏆 Live Scoreboard</h3>
              <p>Check group standings across DIJLA, FURATH, and NAIL.</p>
            </div>
            <div class="panel" onclick="navigate('Results')" style="cursor:pointer; border-left: 4px solid var(--primary-red);">
              <h3 style="color:#fff; margin-top:0;">📜 Published Results</h3>
              <p>View published event results and awarded grades.</p>
            </div>
            <div class="panel" onclick="navigate('Announcements')" style="cursor:pointer; border-left: 4px solid var(--primary-red);">
              <h3 style="color:#fff; margin-top:0;">📢 Announcements</h3>
              <p>Official news, venue details, and schedule updates.</p>
            </div>
          </div>
        `;
      } 
      else if (currentPage === "Scoreboard") {
        app.innerHTML = `<h2>Live Team Standings</h2><div id="score-list" class="grid3">Loading...</div>`;
        loadScoreboard();
      } 
      else if (currentPage === "Results") {
        app.innerHTML = `<h2>Event Results</h2><div id="results-list">Loading...</div>`;
        loadResults();
      } 
      else if (currentPage === "Announcements") {
        app.innerHTML = `<h2>Official Announcements</h2><div id="anno-list">Loading...</div>`;
        loadAnnouncements();
      } 
      else if (currentPage === "Programs") {
        app.innerHTML = `<h2>Programs & Registrations</h2><div id="prog-list">Loading...</div>`;
        loadPrograms();
      } 
      else if (currentPage === "My Fiesta") {
        app.innerHTML = `
          <h2>My Fiesta Lookup</h2>
          <div class="panel">
            <h3>Search Group + Chest Number</h3>
            <input id="cn-input" placeholder="e.g. DIJLA102">
            <button class="primary" onclick="searchStudent()" style="margin-top:10px;">Search Student</button>
          </div>
          <div id="student-res"></div>
        `;
      } 
      else if (currentPage === "Admin") {
        app.innerHTML = renderAdmin();
      }
    }

    function toggleRoleInputs(role) {
      const isStudent = (role === "Student");
      document.getElementById("access-key-group").style.display = isStudent ? "none" : "block";
      
      const label = document.getElementById("identifier-label");
      const input = document.getElementById("user-identifier");
      
      if (isStudent) {
        label.innerText = "Group + Chest Number";
        input.placeholder = "e.g. DIJLA102";
      } else {
        label.innerText = "Your Name or ID";
        input.placeholder = "e.g. Admin / Alex";
      }
    }

    function handleLogin() {
      const role = document.getElementById("role-select").value;
      const identifier = document.getElementById("user-identifier").value.trim().toUpperCase();
      const accessKey = document.getElementById("access-key").value.trim();

      if (!identifier) { 
        alert(role === "Student" ? "Please enter your Group + Chest Number (e.g. DIJLA102)." : "Please enter your Name or ID."); 
        return; 
      }

      if (role === "Student") {
        const validPrefixes = ["DIJLA", "FURATH", "NAIL"];
        const hasValidPrefix = validPrefixes.some(prefix => identifier.startsWith(prefix));
        if (!hasValidPrefix) {
          alert("Please enter a valid format with your group name, e.g., DIJLA102, FURATH201, or NAIL305.");
          return;
        }
      }

      if (role !== "Student" && accessKey !== ROLE_KEYS[role]) { 
        alert("Invalid Access PIN for " + role); 
        return; 
      }

      currentUser = { name: identifier };
      currentRole = role;
      localStorage.setItem("hiya_user", JSON.stringify(currentUser));
      localStorage.setItem("hiya_role", currentRole);
      navigate("Home");
    }

    function logout() {
      currentUser = null; currentRole = null;
      localStorage.removeItem("hiya_user"); localStorage.removeItem("hiya_role");
      navigate("Login");
    }

    // --- SUPABASE ACTIONS ---
    async function loadScoreboard() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('results').select('*');
      const teams = { DIJLA: 0, FURATH: 0, NAIL: 0 };
      if (data) { data.forEach(r => { if (teams[r.group_name] !== undefined) teams[r.group_name] += Number(r.points) || 0; }); }
      document.getElementById("score-list").innerHTML = Object.keys(teams).map(t => `
        <div class="panel"><div class="eyebrow">GROUP</div><h3>${t}</h3><div class="big-number">${teams[t]}</div><p>Total Points</p></div>
      `).join('');
    }

    async function loadResults() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('results').select('*');
      const container = document.getElementById("results-list");
      if (!data || data.length === 0) { container.innerHTML = `<div class="panel">No results published yet.</div>`; return; }
      container.innerHTML = data.map(r => `<div class="panel"><h3>${r.program}</h3><p><strong>Winner:</strong> ${r.winner} (${r.group_name}) | Grade: <span class="pill">${r.grade}</span> | Points: <strong>${r.points}</strong></p></div>`).join('');
    }

    async function loadAnnouncements() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('announcements').select('*');
      const container = document.getElementById("anno-list");
      if (!data || data.length === 0) { container.innerHTML = `<div class="panel">No announcements posted yet.</div>`; return; }
      container.innerHTML = data.map(a => `<div class="panel"><h3 style="color:var(--accent-gold);">${a.title}</h3><p>${a.body}</p></div>`).join('');
    }

    async function loadPrograms() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('programmes').select('*');
      const container = document.getElementById("prog-list");
      if (!data || data.length === 0) { container.innerHTML = `<div class="panel">No programmes scheduled yet.</div>`; return; }
      container.innerHTML = data.map(p => `
        <div class="panel">
          <h3>${p.name} <span class="pill">${p.category || 'General'}</span></h3>
          <p>Stage: ${p.stage || 'TBA'} | Venue: ${p.venue || 'TBA'} | Time: ${p.date || 'TBA'}</p>
          <button class="primary" onclick="registerSelfForProgram('${p.name}')">Register Entry</button>
        </div>
      `).join('');
    }

    async function registerSelfForProgram(programName) {
      const chestNo = prompt("Enter Group + Chest Number to register for " + programName + " (e.g. DIJLA102):");
      if (!chestNo) return;
      const cleanCode = chestNo.trim().toUpperCase();
      const { data: student } = await supabaseClient.from('students').select('*').eq('code', cleanCode);
      if (!student || student.length === 0) { alert("Student entry not found!"); return; }
      const s = student[0];
      const { error } = await supabaseClient.from('registrations').insert([{ program: programName, chest_no: s.code, student_name: s.name, group_name: s.group_name }]);
      alert(error ? "Error: " + error.message : `Registered ${s.name} (${s.code}) successfully!`);
    }

    async function searchStudent() {
      const code = document.getElementById("cn-input").value.trim().toUpperCase();
      if (!code || !supabaseClient) return;
      const { data: sData } = await supabaseClient.from('students').select('*').eq('code', code);
      const { data: rData } = await supabaseClient.from('registrations').select('*').eq('chest_no', code);
      const container = document.getElementById("student-res");
      if (!sData || sData.length === 0) { container.innerHTML = `<div class="panel"><p>No student found for identifier: ${code}</p></div>`; return; }
      const s = sData[0];
      const progList = (rData && rData.length > 0) ? rData.map(r => r.program).join(', ') : 'None';
      container.innerHTML = `<div class="panel"><h3>${s.name} (${s.code})</h3><p>Group: <strong style="color:var(--accent-gold);">${s.group_name}</strong> | Registered Programs: ${progList}</p></div>`;
    }

    function renderAdmin() {
      return `
        <h2>Admin & Controller Portal</h2>
        <div class="panel">
          <h3>Add Student</h3>
          <input id="sn" placeholder="Student Name">
          <input id="scode" placeholder="Group + Chest No (e.g. DIJLA102)">
          <select id="sg"><option>DIJLA</option><option>FURATH</option><option>NAIL</option></select>
          <button class="primary" onclick="addStudent()" style="margin-top:8px;">Save Student</button>
        </div>
        <div class="panel">
          <h3>Add Programme</h3>
          <input id="pname" placeholder="Programme Name">
          <input id="pstage" placeholder="Stage">
          <input id="pdate" placeholder="Time/Date">
          <input id="pvenue" placeholder="Venue">
          <button class="primary" onclick="addProgramme()" style="margin-top:8px;">Save Programme</button>
        </div>
        <div class="panel">
          <h3>Publish Result</h3>
          <input id="rpname" placeholder="Programme Name">
          <select id="rgroup"><option>DIJLA</option><option>FURATH</option><option>NAIL</option></select>
          <input id="rwinner" placeholder="Winner Name & Group+Chest No">
          <select id="rgrade"><option>A</option><option>B</option><option>C</option></select>
          <input id="rpoints" type="number" placeholder="Points">
          <button class="primary" onclick="addResult()" style="margin-top:8px;">Publish Result</button>
        </div>
      `;
    }

    async function addStudent() {
      const item = { name: document.getElementById("sn").value.trim(), code: document.getElementById("scode").value.trim().toUpperCase(), group_name: document.getElementById("sg").value };
      const { error } = await supabaseClient.from('students').insert([item]);
      alert(error ? "Error: " + error.message : "Student saved!");
    }

    async function addProgramme() {
      const item = { name: document.getElementById("pname").value.trim(), stage: document.getElementById("pstage").value, date: document.getElementById("pdate").value.trim(), venue: document.getElementById("pvenue").value.trim() };
      const { error } = await supabaseClient.from('programmes').insert([item]);
      alert(error ? "Error: " + error.message : "Programme added!");
    }

    async function addResult() {
      const item = { program: document.getElementById("rpname").value.trim(), group_name: document.getElementById("rgroup").value, winner: document.getElementById("rwinner").value.trim(), grade: document.getElementById("rgrade").value, points: Number(document.getElementById("rpoints").value) || 0 };
      const { error } = await supabaseClient.from('results').insert([item]);
      alert(error ? "Error: " + error.message : "Result published!");
    }

    const savedUser = localStorage.getItem("hiya_user");
    const savedRole = localStorage.getItem("hiya_role");
    if (savedUser && savedRole) {
      currentUser = JSON.parse(savedUser);
      currentRole = savedRole;
      currentPage = "Home";
    }

    renderNav();
    renderPage();
  </script>
</body>
</html>
